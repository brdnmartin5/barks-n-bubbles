{% extends "base.html" %}

{% block title %}Edit Appointment{% endblock %}

{% block content %}

<h1 class="mb-4">Edit Appointment</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Pet</label>

        <select name="pet_id" class="form-select" required>

            {% for pet in pets %}

            <option
                value="{{ pet['petID'] }}"
                {% if pet['petID'] == appointment['petID'] %}selected{% endif %}>

                {{ pet["petName"] }}

            </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">Service</label>

        <select name="service_id" class="form-select" required>

            {% for service in services %}

            <option
                value="{{ service['serviceID'] }}"
                {% if service['serviceID'] == appointment['serviceID'] %}selected{% endif %}>

                {{ service["serviceName"] }}

            </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">Groomer</label>

        <select name="groomer_id" class="form-select" required>

            {% for groomer in groomers %}

            <option
                value="{{ groomer['groomerID'] }}"
                {% if groomer['groomerID'] == appointment['groomerID'] %}selected{% endif %}>

                {{ groomer["groomerFName"] }}
                {{ groomer["groomerLName"] }}

            </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">Appointment Date</label>

        <input
            type="date"
            name="appt_date"
            class="form-control"
            value="{{ appointment['apptDate'] }}"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Appointment Time</label>

        <input
            type="time"
            name="appt_time"
            class="form-control"
            value="{{ appointment['apptTime'] }}"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Status</label>

        <select
            name="status"
            class="form-select">

            <option value="Scheduled"
                {% if appointment['status'] == "Scheduled" %}selected{% endif %}>
                Scheduled
            </option>

            <option value="Completed"
                {% if appointment['status'] == "Completed" %}selected{% endif %}>
                Completed
            </option>

            <option value="Cancelled"
                {% if appointment['status'] == "Cancelled" %}selected{% endif %}>
                Cancelled
            </option>

        </select>

    </div>

    <button
        type="submit"
        class="btn btn-primary">
        Save Changes
    </button>

    <a
        href="/appointments"
        class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
