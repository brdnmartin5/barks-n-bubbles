{% extends "base.html" %}

{% block title %}Edit Customer{% endblock %}

{% block content %}

<h1 class="mb-4">Edit Customer</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">First Name</label>
        <input
            type="text"
            name="first_name"
            class="form-control"
            value="{{ customer['customerFName'] }}"
            required
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input
            type="text"
            name="last_name"
            class="form-control"
            value="{{ customer['customerLName'] }}"
            required
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input
            type="email"
            name="email"
            class="form-control"
            value="{{ customer['customerEmail'] or '' }}"
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>
        <input
            type="text"
            name="phone"
            class="form-control"
            value="{{ customer['customerPhone'] or '' }}"
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Address</label>
        <input
            type="text"
            name="address"
            class="form-control"
            value="{{ customer['customerAddress'] or '' }}"
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Alternate Contact</label>
        <input
            type="text"
            name="alternate_contact"
            class="form-control"
            value="{{ customer['customerAlt'] or '' }}"
        >
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="/customers" class="btn btn-secondary">Cancel</a>

</form>

{% endblock %}
