{% extends "base.html" %}

{% block title %}Edit Service{% endblock %}

{% block content %}

<h1 class="mb-4">Edit Service</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Service Name</label>
        <input
            type="text"
            name="service_name"
            class="form-control"
            value="{{ service['serviceName'] }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea
            name="description"
            class="form-control"
            rows="3">{{ service['description'] }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Price ($)</label>
        <input
            type="number"
            name="price"
            class="form-control"
            step="0.01"
            value="{{ service['price'] }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Duration (minutes)</label>
        <input
            type="number"
            name="duration"
            class="form-control"
            value="{{ service['duration'] }}"
            required>
    </div>

    <button
        type="submit"
        class="btn btn-primary">
        Save Changes
    </button>

    <a
        href="/services"
        class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
