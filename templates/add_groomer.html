{% extends "base.html" %}

{% block title %}Add Groomer{% endblock %}

{% block content %}

<h1 class="mb-4">Add Groomer</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">First Name</label>

        <input
            type="text"
            name="first_name"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Last Name</label>

        <input
            type="text"
            name="last_name"
            class="form-control"
            required>
    </div>
    <div class="mb-3">
        <label class="form-label">Cell Phone</label>
        <input
            type="text"
            name="cell"
            class="form-control">
    </div>
    
    <div class="mb-3">
        <label class="form-label">Specialty</label>
        <input
            type="text"
            name="specialty"
            class="form-control">
    </div>
    <button
        type="submit"
        class="btn btn-primary">
        Save Groomer
    </button>

    <a
        href="/groomers"
        class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
