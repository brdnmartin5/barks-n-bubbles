{% extends "base.html" %}

{% block title %}Edit Pet{% endblock %}

{% block content %}

<h1 class="mb-4">Edit Pet</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Pet Name</label>
        <input
            type="text"
            name="pet_name"
            class="form-control"
            value="{{ pet['petName'] }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Breed</label>
        <input
            type="text"
            name="breed"
            class="form-control"
            value="{{ pet['breed'] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Size</label>

        <select name="size" class="form-select">

            <option value="Small"
            {% if pet['size']=="Small" %}selected{% endif %}>
            Small
            </option>

            <option value="Medium"
            {% if pet['size']=="Medium" %}selected{% endif %}>
            Medium
            </option>

            <option value="Large"
            {% if pet['size']=="Large" %}selected{% endif %}>
            Large
            </option>

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">Customer</label>

        <select
            name="customer_id"
            class="form-select">

            {% for customer in customers %}

            <option
                value="{{ customer['customerID'] }}"
                {% if customer['customerID']==pet['customerID'] %}selected{% endif %}>

                {{ customer['customerFName'] }}
                {{ customer['customerLName'] }}

            </option>

            {% endfor %}

        </select>

    </div>

    <button
        type="submit"
        class="btn btn-primary">
        Save Changes
    </button>

    <a
        href="/pets"
        class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
