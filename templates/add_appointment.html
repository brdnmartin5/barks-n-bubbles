{% extends "base.html" %}

{% block title %}Add Appointment{% endblock %}

{% block content %}

<h1 class="mb-4">Add Appointment</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Pet</label>

        <select name="pet_id" class="form-select" required>

            <option value="">Select a pet</option>

            {% for pet in pets %}

            <option value="{{ pet['petID'] }}">
                {{ pet["petName"] }}
            </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">Service</label>

        <select name="service_id" class="form-select" required>

            <option value="">Select a service</option>

            {% for service in services %}

            <option value="{{ service['serviceID'] }}">
                {{ service["serviceName"] }}
            </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">Groomer</label>

        <select name="groomer_id" class="form-select" required>

            <option value="">Select a groomer</option>

            {% for groomer in groomers %}

            <option value="{{ groomer['groomerID'] }}">
                {{ groomer["groomerFName"] }}
                {{ groomer["groomerLName"] }}
            </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">Appointment Date</label>

        <input
            type="date"
            name="appt_date"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Appointment Time</label>

        <input
            type="time"
            name="appt_time"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Status</label>

        <select
            name="status"
            class="form-select">

            <option>Scheduled</option>
            <option>Completed</option>
            <option>Cancelled</option>

        </select>

    </div>

    <button
        type="submit"
        class="btn btn-primary">
        Save Appointment
    </button>

    <a
        href="/appointments"
        class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
